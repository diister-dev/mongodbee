name: CI
on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - develop
      - release/*

defaults:
  run:
    working-directory: library

jobs:
  static:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Build
        run: bun run build

  test:
    name: Tests (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # The suite targets `node:test`, so the same tests run on all three.
    # Worth the matrix: Bun is JavaScriptCore, Node and Deno are V8 — and
    # Deno is what Diivento runs the library on.
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]

    steps:
      - uses: actions/checkout@v5

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '6.0'
          mongodb-port: 27017
          mongodb-replica-set: rs0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18

      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9.6

      - run: bun install --frozen-lockfile

      - name: Test (bun)
        if: matrix.runtime == 'bun'
        run: bun test --parallel

      - name: Test (node)
        if: matrix.runtime == 'node'
        run: node --test "test/**/*.test.ts"

      # test/migration/cli generates migration files and imports them at run
      # time; `deno test` refuses modules that were not in the graph when the
      # run started ("Loading unprepared module"), while `deno run` — how the
      # CLI is actually used — loads them fine. The CLI under Deno is covered
      # by the consumers job below. Types are tsc's job (the check job).
      - name: Test (deno)
        if: matrix.runtime == 'deno'
        run: deno test -A --parallel --no-check --ignore=test/migration/cli test/

  consumers:
    name: Consume the built package (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: static

    # Installs the real tarball into an empty project — the only thing that
    # exercises the `exports` map, the `bin` entry and the `.d.ts` the way a
    # user does.
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18

      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9.6

      - run: bun install --frozen-lockfile

      - name: Build and pack
        run: |
          bun run build
          npm pack --pack-destination /tmp

      - name: Install into an empty project
        working-directory: /tmp
        run: |
          mkdir -p consumer && cd consumer
          echo '{"name":"consumer","type":"module","private":true}' > package.json
          npm install /tmp/diister-mongodbee-*.tgz

      - name: Import every entry point
        working-directory: /tmp/consumer
        run: |
          cat > check.js <<'EOF'
          import { collection, multiCollection, scopedMultiCollection } from "@diister/mongodbee";
          import * as v from "@diister/mongodbee/schema";
          import { migrationDefinition } from "@diister/mongodbee/migration";
          for (const [name, value] of Object.entries({ collection, multiCollection, scopedMultiCollection, object: v.object, migrationDefinition })) {
            if (typeof value !== "function") throw new Error(`${name} did not load`);
          }
          console.log("all entry points loaded");
          EOF
          if [ "${{ matrix.runtime }}" = "deno" ]; then
            deno run -A check.js
          else
            ${{ matrix.runtime }} check.js
          fi

      - name: Run the CLI through its bin entry
        working-directory: /tmp/consumer
        run: ./node_modules/.bin/mongodbee --version

      # `deno run npm:…/bin` (and `jsr:…/bin`, which cannot be exercised
      # before publishing) runs the entry with a non-file URL: the CLI must
      # still recognise itself as the entry point and not exit 0 silently.
      - name: Run the CLI through a package specifier (deno)
        if: matrix.runtime == 'deno'
        working-directory: /tmp/consumer
        run: |
          out=$(deno run -A npm:@diister/mongodbee/migration/cli/bin --version)
          echo "$out"
          test -n "$out"
