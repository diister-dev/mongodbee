name: CI
on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - develop
      - release/*

defaults:
  run:
    working-directory: library

jobs:
  static:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Build
        run: bun run build

  test:
    name: Tests (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # The suite targets `node:test`, so the same tests run on both.
    # Worth the matrix: Bun is JavaScriptCore, Node is V8.
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]

    steps:
      - uses: actions/checkout@v5

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '6.0'
          mongodb-port: 27017
          mongodb-replica-set: rs0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18

      - run: bun install --frozen-lockfile

      - name: Test (bun)
        if: matrix.runtime == 'bun'
        run: bun test

      - name: Test (node)
        if: matrix.runtime == 'node'
        run: node --test "test/**/*.test.ts"

  consumers:
    name: Consume the built package (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: static

    # Installs the real tarball into an empty project — the only thing that
    # exercises the `exports` map, the `bin` entry and the `.d.ts` the way a
    # user does.
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18

      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9.6

      - run: bun install --frozen-lockfile

      - name: Build and pack
        run: |
          bun run build
          npm pack --pack-destination /tmp

      - name: Install into an empty project
        working-directory: /tmp
        run: |
          mkdir -p consumer && cd consumer
          echo '{"name":"consumer","type":"module","private":true}' > package.json
          # Until @diister/valibot-mock is on npmjs.org, it resolves through
          # JSR's npm compatibility registry. Drop this once it is published.
          echo '@jsr:registry=https://npm.jsr.io' > .npmrc
          npm install /tmp/mongodbee-*.tgz

      - name: Import every entry point
        working-directory: /tmp/consumer
        run: |
          cat > check.js <<'EOF'
          import { collection, multiCollection, scopedMultiCollection } from "mongodbee";
          import * as v from "mongodbee/schema";
          import { migrationDefinition } from "mongodbee/migration";
          for (const [name, value] of Object.entries({ collection, multiCollection, scopedMultiCollection, object: v.object, migrationDefinition })) {
            if (typeof value !== "function") throw new Error(`${name} did not load`);
          }
          console.log("all entry points loaded");
          EOF
          if [ "${{ matrix.runtime }}" = "deno" ]; then
            deno run -A check.js
          else
            ${{ matrix.runtime }} check.js
          fi

      - name: Run the CLI through its bin entry
        working-directory: /tmp/consumer
        run: ./node_modules/.bin/mongodbee --version
